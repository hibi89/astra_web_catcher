name: p4 Offline Full Regression and Cross-Engine Preview

on:
  push:
    branches:
      - feature/observation-contract-20261018
    paths:
      - .github/workflows/p4-regression-cross-engines.yml
      - scripts/p4_multi_browser_smoke.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4-offline-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-regression:
    name: Full offline pytest (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt 'selenium>=4.27,<5'
      - name: Python compile check
        run: python -m compileall -q app astra_contracts scripts tests
      - name: Run full repository offline regression
        run: python -m pytest -q -ra tests --junitxml=pytest-full.xml
      - name: Preserve full regression summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-pytest-full-summary
          path: pytest-full.xml
          if-no-files-found: ignore
          retention-days: 7

  linux-engines:
    name: Chromium Firefox WebKit (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install preview dependencies and browser engines
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Test three real browser engines (desktop and mobile viewports)
        run: |
          python -m scripts.p4_multi_browser_smoke \
            --fixture examples/p4_chart_table_synthetic_schema.json \
            --rows examples/p4_chart_table_synthetic_rows.json \
            --engine chromium --engine firefox --engine webkit \
            > p4-browser-linux.json
          cat p4-browser-linux.json
      - name: Preserve browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-browser-linux
          path: p4-browser-linux.json
          if-no-files-found: ignore
          retention-days: 7

  windows-edge:
    name: Actual Microsoft Edge on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install preview dependencies and Microsoft Edge
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install msedge
      - name: Test real Windows Edge browser
        shell: pwsh
        run: |
          python -m scripts.p4_multi_browser_smoke --fixture examples/p4_chart_table_synthetic_schema.json --rows examples/p4_chart_table_synthetic_rows.json --engine msedge > p4-browser-edge.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content p4-browser-edge.json
      - name: Preserve Windows Edge results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p4-browser-windows-edge
          path: p4-browser-edge.json
          if-no-files-found: ignore
          retention-days: 7
